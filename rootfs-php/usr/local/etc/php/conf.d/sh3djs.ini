; Sensible defaults for SweetHome3DJS
; The PHP API is trivial I/O, so we don't need exotic tuning.

; Bigger uploads (home files can be 10+ MB)
upload_max_filesize = 50M
post_max_size = 50M
memory_limit = 128M

; opcache: always on for a static-ish app
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Don't expose PHP version
expose_php = Off

; Useful for debugging during dev; comment out in prod
; display_errors = On
; error_reporting = E_ALL
