services:
  # ------------------------------------------------------------------
  # Sweet Home 3D desktop app via VNC
  # ------------------------------------------------------------------
  # The full Java desktop app, served over VNC to a browser.
  # Best for: complex editing, photo/video rendering, all plugins.
  # Worst for: touch devices (the VNC stream is desktop-sized).
  # ------------------------------------------------------------------
  sweethome3d:
    build: .
    container_name: sweethome3d
    restart: unless-stopped
    ports:
      - "5800:5800"   # Web UI - http://<host-ip>:5800
      # - "5900:5900" # Optional: uncomment for VNC client access instead of the browser
    volumes:
      - ./config:/config   # IMPORTANT: persists your saved plans. Without this, everything is lost when the container is recreated.
    environment:
      - USER_ID=1000          # Match the host user who should own ./config (run `id` on the host to check)
      - GROUP_ID=1000         # Match that user's group ID
      - TZ=Etc/UTC            # e.g. Europe/Paris - keeps log timestamps correct
      - KEEP_APP_RUNNING=1    # Auto-restart Sweet Home 3D if it crashes
      # - SECURE_CONNECTION=1            # Recommended if you expose this beyond your LAN (serves over HTTPS)
      # - WEB_AUTHENTICATION=1           # Adds a login page (requires SECURE_CONNECTION=1)
      # - WEB_AUTHENTICATION_USERNAME=changeme
      # - WEB_AUTHENTICATION_PASSWORD=changeme

      # ---- Mobile-friendly web UI (see README) ----
      # The remote desktop is rendered at this resolution and then
      # scaled down to fit the browser window. Going larger here means
      # more visible detail (Sweet Home 3D is resolution-sensitive),
      # at the cost of more CPU/bandwidth. 1920x1080 is a good default.
      # For a phone on a slow link, try 1600x900 or 1366x768.
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080

  # ------------------------------------------------------------------
  # Sweet Home 3D JS web editor
  # ------------------------------------------------------------------
  # A pure HTML5 / WebGL port of Sweet Home 3D that runs entirely in
  # the browser. Truly responsive, touch-friendly, no VNC.
  # Best for: editing on phones/tablets, quick design sessions.
  # Limits: no plugins, default furniture catalog only, no photo
  # rendering.
  #
  # Plans are saved as .sh3x files in ./plans/ (the data dir). To
  # share with the desktop app above, mount the SAME directory:
  #   - either by changing the desktop app's KEEP_APP_RUNNING-volume
  #     to ./plans
  #   - or by symlinking ./config/.sweethome3d to ./plans
  # ------------------------------------------------------------------
  sweethome3d-web:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: sweethome3d-web
    restart: unless-stopped
    ports:
      - "5801:5801"   # Web editor - http://<host-ip>:5801
    volumes:
      - ./plans:/opt/sh3djs/data   # Persists your saved .sh3x files
    environment:
      - TZ=Etc/UTC
